<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; /* Light gray background */
            font-family: Arial, sans-serif;
        }

        .car-profile-container {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            padding: 40px;
            gap: 20px;
        }

        .car-profile-image {
            flex: 0 0 35%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .car-profile-image img {
            width: 100%;
            height: auto;
        }

        .car-details {
            font-family: 'Dancing Script', cursive; /* Apply Dancing Script font */

            flex: 1;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .car-details h2 {
            color: #343a40;
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .car-details p {
            color: #6c757d;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .car-details ul {
            list-style: none;
            padding: 0;
        }

        .car-details ul li {
            font-size: 16px;
            color: #495057;
            margin-bottom: 10px;
        }

        .car-details button {
            background-color: #495057;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        .car-details button:hover {
            background-color: #495057;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="car-profile-container">
            <!-- Car Image -->
            <div class="car-profile-image">
                <img id="carImage" alt="Car Image">
            </div>

            <!-- Car Details -->
            <div class="car-details">
                <h2 id="carModel">Car Model</h2>
                <p id="carPrice">Price: N/A</p>
                <ul>
                    <li><strong>Fuel Type:</strong> Petrol</li>
                    <li><strong>Engine:</strong> 1.4L Turbo</li>
                    <li><strong>Transmission:</strong> Automatic</li>
                    <li><strong>Seats:</strong> 5</li>
                    <li><strong>Mileage:</strong> 20 km/l</li>
                </ul>
                <button class="btn gradient-btn">Explore Features</button>
            </div>
        </div>
    </div>

    <script>
        // Parse the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const model = urlParams.get("model");
        const price = urlParams.get("price");
        const image = urlParams.get("image");

        // Populate the page with car details
        document.getElementById("carModel").textContent = model;
        document.getElementById("carPrice").textContent = `Price: ${price}`;
        document.getElementById("carImage").src = image;
    </script>
</body>
</html>
